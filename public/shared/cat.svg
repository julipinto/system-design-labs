<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- O gato de pelúcia da Lena, sentado, em traço fino isométrico (mesma linguagem das figuras iso-glow).
       Tinta = currentColor; o laço é o único ponto em sódio (--cat-accent). -->
  <g stroke="currentColor" stroke-width="1.5">
    <!-- sombra no chão: losango isométrico -->
    <path d="M60 104 L92 88 L60 72 L28 88 Z" stroke-opacity=".35"/>
    <!-- rabo enrolado no chão -->
    <path d="M80 92 C96 90 100 80 92 74 C88 71 84 74 86 78"/>
    <!-- corpo: pera sentada -->
    <path d="M42 90 C36 78 38 62 48 55 L72 55 C82 62 84 78 78 90 C72 96 48 96 42 90 Z"/>
    <!-- patas da frente -->
    <path d="M52 92 C52 86 54 80 56 76"/>
    <path d="M68 92 C68 86 66 80 64 76"/>
    <path d="M48 93 C50 95 55 95 56 92"/>
    <path d="M64 92 C65 95 70 95 72 93"/>
    <!-- costura da barriga de pelúcia -->
    <path d="M60 62 L60 70" stroke-dasharray="1.5 3" stroke-opacity=".6"/>
    <!-- cabeça -->
    <path d="M38 38 C38 26 48 20 60 20 C72 20 82 26 82 38 C82 49 72 55 60 55 C48 55 38 49 38 38 Z"/>
    <!-- orelhas -->
    <path d="M42 30 L40 12 L54 22"/>
    <path d="M78 30 L80 12 L66 22"/>
    <path d="M44 25 L43 17 L50 22" stroke-opacity=".5"/>
    <path d="M76 25 L77 17 L70 22" stroke-opacity=".5"/>
    <!-- olhos fechados, contentes -->
    <path d="M48 37 C50 39.5 53 39.5 55 37"/>
    <path d="M65 37 C67 39.5 70 39.5 72 37"/>
    <!-- focinho e boca -->
    <path d="M58.5 42 L61.5 42 L60 44 Z"/>
    <path d="M60 44 C59 47 56 47 55 45.5"/>
    <path d="M60 44 C61 47 64 47 65 45.5"/>
    <!-- bigodes -->
    <path d="M46 43 L36 41" stroke-opacity=".6"/>
    <path d="M46 46 L37 47" stroke-opacity=".6"/>
    <path d="M74 43 L84 41" stroke-opacity=".6"/>
    <path d="M74 46 L83 47" stroke-opacity=".6"/>
  </g>
  <!-- laço no pescoço, em sódio -->
  <g stroke="var(--cat-accent, #ff9d3c)" stroke-width="1.6">
    <path d="M60 57 L49 51 L50 62 Z"/>
    <path d="M60 57 L71 51 L70 62 Z"/>
    <circle cx="60" cy="57" r="2.4" fill="var(--cat-accent, #ff9d3c)"/>
  </g>
</svg>
